<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Klinik TCM - AI Iridologi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background-color: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; }
        .form-row { display: flex; gap: 15px; margin-bottom:15px; }
        .form-col { flex: 1; }
        label { font-weight: 600; font-size: 13px; margin-bottom: 5px; display: block; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: 'Poppins'; font-size: 14px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:disabled { background: #95a5a6; }
        .search-box { background: #e8f4f8; padding: 15px; border-radius: 8px; margin-bottom: 25px; }
        .history-card { background: #fff; padding: 15px; margin-top: 10px; border-left: 4px solid #3498db; font-size: 13px; border-radius: 6px; }
        .image-preview { width: 100%; max-height: 200px; object-fit: contain; margin-top: 10px; display: none; border-radius: 8px; border: 2px dashed #bdc3c7; }
        .section-title { margin-top: 25px; margin-bottom: 15px; padding-bottom: 5px; border-bottom: 2px solid #3498db; color: #2980b9; font-size: 16px; }
        #modalConfig { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

<div id="modalConfig">
    <div class="modal-content">
        <h3 style="margin-top:0;">⚙️ Setup Profil Klinik</h3>
        <input type="text" id="confNama" placeholder="Nama Klinik" style="margin-bottom:10px;">
        <input type="text" id="confSingkatan" placeholder="Singkatan NRM (TCM)" style="margin-bottom:10px;" maxlength="4">
        <input type="text" id="confAlamat" placeholder="Alamat Praktik" style="margin-bottom:10px;">
        <input type="text" id="confKontak" placeholder="No. WA Klinik" style="margin-bottom:15px;">
        <button id="btnSaveConfig">Simpan Konfigurasi</button>
    </div>
</div>

<div class="container" id="mainApp" style="display:none;">
    <h2 id="judulKlinik">Klinik TCM</h2>

    <div class="search-box">
        <h4 style="margin-top:0; color:#2980b9;">🔍 Cari Riwayat Pasien Lama</h4>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="inputSearch" placeholder="Ketik NRM atau Nama...">
            <button type="button" id="btnSearch" style="width: 80px;">Cari</button>
        </div>
        <div id="searchResults"></div>
    </div>

    <form id="formKlinis">
        <div class="section-title">👤 Profil Dasar (Statik)</div>
        <div class="form-row">
            <div class="form-col"><label>NRM:</label><input type="text" id="nrmKlien" placeholder="Kosongkan jika Baru" readonly style="background:#f1f3f5;"></div>
            <div class="form-col"><label>Nama Lengkap:</label><input type="text" id="namaKlien" required></div>
        </div>
        <div class="form-row">
            <div class="form-col"><label>Umur (Thn):</label><input type="number" id="umurKlien" required></div>
            <div class="form-col"><label>Gender:</label><select id="genderKlien" required><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></div>
            <div class="form-col"><label>BB (Kg):</label><input type="number" id="beratKlien" required></div>
        </div>
        <div class="form-row">
            <div class="form-col"><label>No. WhatsApp:</label><input type="number" id="noWaKlien"></div>
        </div>

        <div class="section-title">🩺 Observasi Kunjungan Harian</div>
        <div class="form-row">
            <div class="form-col"><label>Tensi & Nadi:</label><input type="text" id="tensiKlien" placeholder="Contoh: 130/80/80"></div>
            <div class="form-col">
                <label>Keluhan Utama:</label>
                <select id="keluhanUtama" required>
                    <option value="" disabled selected>-- Pilih --</option>
                    <option value="Pencernaan (Maag, Diare)">Pencernaan (Maag, Diare)</option>
                    <option value="Nyeri Sendi/Saraf (Pinggang, Lutut)">Nyeri Sendi/Saraf (Pinggang, Lutut)</option>
                    <option value="Emosi/Tidur (Stres, Insomnia)">Emosi/Tidur (Stres, Insomnia)</option>
                    <option value="Lainnya">Lainnya...</option>
                </select>
            </div>
        </div>
        <label>Gejala Penyerta:</label>
        <textarea id="gejalaKlien" rows="2" placeholder="Contoh: Asam urat paha lutut..." required style="margin-bottom:15px;"></textarea>

        <label>Wawancara (Kondisi Emosi/Shen):</label>
        <textarea id="dataWawancara" rows="2" placeholder="Apakah stres? Tidur lelap?" required></textarea>

        <div class="section-title">📸 Modul Mata AI (Computer Vision)</div>
        <div class="form-row">
            <div class="form-col">
                <label>1. Foto Lidah (Wajib):</label>
                <input type="file" id="fotoLidah" accept="image/*" capture="environment" required>
                <img id="previewLidah" class="image-preview">
            </div>
            <div class="form-col" id="boxIris">
                <label>2. Foto Iris Mata (Opsional):</label>
                <input type="file" id="fotoIris" accept="image/*" capture="environment">
                <img id="previewIris" class="image-preview">
                <p style="font-size:11px; color:#7f8c8d; margin-top:5px;">Foto jarak dekat. Biarkan kosong jika pasien lama.</p>
                <input type="hidden" id="riwayatIrisTxt">
            </div>
        </div>

        <button type="submit" id="btnSubmit" style="margin-top:20px;">Analisis AI & Simpan ke 3 Sheet</button>
    </form>

    <div id="hasilContainer" style="display:none; margin-top:30px; border-top:2px dashed #ccc; padding-top:20px;">
        <h3 style="color:#27ae60; text-align:center;">Diagnosis Berhasil!</h3>
        <div style="background:#f9f9f9; padding:15px; border-radius:8px; border-left:4px solid #8e44ad; margin-bottom:15px;">
            <b style="color:#8e44ad;">👁️ Analisis Iridologi AI:</b>
            <p id="resIris" style="font-size:14px; margin-top:5px;"></p>
        </div>
        <div style="background:#fff; padding:20px; border:1px solid #ddd; border-radius:8px; font-size:14px; line-height:1.6;" id="resLengkap"></div>
        <button type="button" id="btnReset" style="background:#95a5a6; margin-top: 15px;">🔄 Pasien Baru</button>
    </div>
</div>

<script>
    // ⚠️ MASUKKAN URL WEB APP GOOGLE SCRIPT TERBARU DI SINI
    const scriptURL = "https://script.google.com/macros/s/AKfycbw0egBKH6XRWd-O8CuqU3ztMSDBLgfcAN__CxH-rVFVx34CZLcfSQGRYB-4saDZyw/exec"; 
    
    let base64Lidah = ""; let base64Iris = "";

    window.onload = async function() {
        const res = await fetch(scriptURL, { method: 'POST', body: JSON.stringify({ action: "getConfig" }) });
        const result = await res.json();
        if (result.status === "kosong") document.getElementById('modalConfig').style.display = "flex";
        else { document.getElementById('judulKlinik').innerText = result.data.nama; document.getElementById('mainApp').style.display = "block"; }
    };

    document.getElementById('btnSaveConfig').addEventListener('click', async function() {
        const payload = { action: "setConfig", nama: document.getElementById('confNama').value, singkatan: document.getElementById('confSingkatan').value, alamat: document.getElementById('confAlamat').value, kontak: document.getElementById('confKontak').value };
        await fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) });
        location.reload();
    });

    // PENCARIAN & AUTO-FILL
    document.getElementById('btnSearch').addEventListener('click', async function() {
        const keyword = document.getElementById('inputSearch').value;
        if(!keyword) return;
        const resDiv = document.getElementById('searchResults');
        resDiv.innerHTML = "<i>Mencari...</i>";
        const res = await fetch(scriptURL, { method: 'POST', body: JSON.stringify({ action: "search", searchKey: keyword }) });
        const result = await res.json();
        
        if (result.status === "sukses" && result.data.length > 0) {
            let html = '';
            result.data.forEach(r => {
                html += `<div class="history-card">
                            <b>[${r.nrm}] ${r.nama}</b><br>
                            <span style="font-size:12px; color:#555;">Umur: ${r.umur} | BB: ${r.berat} Kg</span><br>
                            <button type="button" onclick='pilihPasien(${JSON.stringify(r).replace(/'/g, "\\'")})' style="width:auto; padding:6px 12px; font-size:12px; background:#27ae60; margin-top:5px; color:#fff; border:none; border-radius:4px; cursor:pointer;">Pilih Pasien</button>
                         </div>`;
            });
            resDiv.innerHTML = html;
        } else { resDiv.innerHTML = '<b style="color:red">Tidak ditemukan.</b>'; }
    });

    window.pilihPasien = function(data) {
        document.getElementById('nrmKlien').value = data.nrm;
        document.getElementById('namaKlien').value = data.nama;
        document.getElementById('noWaKlien').value = data.wa;
        document.getElementById('umurKlien').value = data.umur;
        document.getElementById('genderKlien').value = data.gender;
        document.getElementById('beratKlien').value = data.berat;
        document.getElementById('riwayatIrisTxt').value = data.analisisIris;
        
        if(data.analisisIris && data.analisisIris !== "") {
            document.getElementById('boxIris').style.opacity = "0.5";
            document.getElementById('boxIris').title = "Foto iris genetik sudah tersimpan di database.";
        }
        document.getElementById('formKlinis').scrollIntoView({behavior: "smooth"});
    };

    // HANDLE IMAGES
    document.getElementById('fotoLidah').addEventListener('change', function(e) {
        if(e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(evt) { document.getElementById('previewLidah').src = evt.target.result; document.getElementById('previewLidah').style.display = 'block'; base64Lidah = evt.target.result; }
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    document.getElementById('fotoIris').addEventListener('change', function(e) {
        if(e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(evt) { document.getElementById('previewIris').src = evt.target.result; document.getElementById('previewIris').style.display = 'block'; base64Iris = evt.target.result; }
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    // SUBMIT DATA
    document.getElementById('formKlinis').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true; btn.innerText = "🧠 AI Sedang Membedah 2 Gambar...";
        
        const payload = {
            action: "insert", 
            nrm: document.getElementById('nrmKlien').value, 
            namaKlien: document.getElementById('namaKlien').value,
            noWa: document.getElementById('noWaKlien').value,
            umur: document.getElementById('umurKlien').value,
            gender: document.getElementById('genderKlien').value,
            berat: document.getElementById('beratKlien').value,
            tensi: document.getElementById('tensiKlien').value,
            keluhan: document.getElementById('keluhanUtama').value,
            gejala: document.getElementById('gejalaKlien').value, 
            wawancara: document.getElementById('dataWawancara').value,
            riwayatIris: document.getElementById('riwayatIrisTxt').value,
            imgLidah: base64Lidah,
            imgIris: base64Iris
        };

        try {
            const res = await fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await res.json();
            
            if (result.status === "sukses") {
                const rd = result.data;
                
                document.getElementById('resIris').innerText = rd.analisis_iris || "Menggunakan rekam data mata sebelumnya.";
                document.getElementById('resLengkap').innerHTML = `
                    <b style="color:#e74c3c; font-size:16px;">${rd.diagnosis}</b><br>
                    <i style="color:#555;">${rd.penjelasan}</i><hr style="border: 0.5px solid #eee; margin:15px 0;">
                    <b>🎯 Tung:</b> ${rd.tung}<br><br>
                    <b>⚖️ Tan:</b> ${rd.tan}<br><br>
                    <b>🧠 YNSA:</b> ${rd.yamamoto}<br><br>
                    <b>🤲 Tuina:</b> ${rd.tuina}<br><br>
                    <b>🔴 Bekam:</b> ${rd.bekam}<br><br>
                    <b>🌿 Jamu:</b> ${rd.jamu}<hr style="border: 0.5px solid #eee; margin:15px 0;">
                    <b>🏃 Gerak:</b> ${rd.gerak}<br><br>
                    <b>🥗 Makanan:</b> ${rd.makanan}
                `;
                document.getElementById('hasilContainer').style.display = "block"; 
            } else { alert("Gagal: " + result.pesan); }
        } catch (e) { alert("Server Sibuk. Ulangi."); } 
        finally { btn.disabled = false; btn.innerText = "Analisis AI & Simpan ke 3 Sheet"; }
    });

    document.getElementById('btnReset').addEventListener('click', () => location.reload());
</script>
</body>
</html>
