<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Klinik TCM - AI Iridologi & Lidah</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background-color: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; }
        .form-row { display: flex; gap: 15px; margin-bottom:15px; }
        .form-col { flex: 1; }
        label { font-weight: 600; font-size: 13px; margin-bottom: 5px; display: block; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: 'Poppins'; font-size: 14px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:disabled { background: #95a5a6; }
        .btn-wa { background: #25D366; margin-top: 15px; }
        .btn-reset { background: #95a5a6; margin-top: 10px; } 
        .image-preview { width: 100%; max-height: 180px; object-fit: contain; margin-top: 10px; display: none; border-radius: 8px; border: 2px dashed #bdc3c7; padding: 5px; }
        .section-title { margin-top: 25px; margin-bottom: 15px; padding-bottom: 5px; border-bottom: 2px solid #3498db; color: #2980b9; font-size: 16px; font-weight:bold; }
    </style>
</head>
<body>

<div class="container" id="mainApp">
    <h2>Klinik TCM & Iridologi</h2>

    <form id="formKlinis">
        <div class="section-title">👤 Profil Klien</div>
        <div class="form-row">
            <div class="form-col"><label>NRM:</label><input type="text" id="nrmKlien" placeholder="Otomatis" readonly style="background-color: #f1f3f5;"></div>
            <div class="form-col"><label>Tensi & Nadi:</label><input type="text" id="tensiKlien" placeholder="Contoh: 120/80/80"></div>
        </div>
        <div class="form-row">
            <div class="form-col"><label>Nama Lengkap:</label><input type="text" id="namaKlien" required></div>
            <div class="form-col"><label>No. WhatsApp:</label><input type="text" id="noWaKlien"></div>
        </div>
        <div class="form-row">
            <div class="form-col"><label>Umur (Thn):</label><input type="number" id="umurKlien" required></div>
            <div class="form-col"><label>Gender:</label><select id="genderKlien" required><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></div>
            <div class="form-col"><label>BB (Kg):</label><input type="number" id="beratKlien" required></div>
        </div>
        
        <div class="section-title">🩺 Observasi Sindrom</div>
        <label>Keluhan Utama:</label>
        <select id="keluhanUtama" required style="margin-bottom:10px;">
            <option value="" disabled selected>-- Pilih Keluhan Utama --</option>
            <option value="Gangguan Pencernaan (Maag, Diare, Cegukan)">Gangguan Pencernaan (Maag, Diare, Cegukan)</option>
            <option value="Gangguan Pernapasan (Batuk, Asma, Sesak)">Gangguan Pernapasan (Batuk, Asma, Sesak)</option>
            <option value="Nyeri Otot, Sendi & Saraf (Pinggang, Jari, Tumit, dll)">Nyeri Otot, Sendi & Saraf (Pinggang, Jari, Tumit, dll)</option>
            <option value="Metabolik & Diet (Gula, Asam Urat, Obesitas)">Metabolik & Diet (Gula, Asam Urat, Obesitas)</option>
        </select>
        
        <label>Gejala Penyerta:</label>
        <select id="gejalaKlien" required style="margin-bottom:15px;">
            <option value="" disabled selected>-- Pilih Gejala --</option>
        </select>

        <label>Catatan Wawancara (Anamnesis):</label>
        <textarea id="dataWawancara" rows="4" required></textarea>
        
        <div class="section-title">📸 Modul AI Vision (Lidah & Iris Ganda)</div>
        
        <!-- Foto Lidah -->
        <div style="background:#f9f9f9; padding:15px; border-radius:8px; margin-bottom:15px;">
            <label>1. Foto Lidah (Wajib):</label>
            <input type="file" id="fotoLidah" accept="image/*" required style="margin-top:5px;">
            <img id="previewLidah" class="image-preview">
        </div>

        <!-- Foto Iris Kiri & Kanan -->
        <div class="form-row">
            <div class="form-col" style="background:#e8f4f8; padding:15px; border-radius:8px;">
                <label>2. Foto Iris Mata KIRI (Opsional):</label>
                <input type="file" id="fotoIrisKiri" accept="image/*" style="margin-top:5px;">
                <img id="previewIrisKiri" class="image-preview">
            </div>
            <div class="form-col" style="background:#e8f4f8; padding:15px; border-radius:8px;">
                <label>3. Foto Iris Mata KANAN (Opsional):</label>
                <input type="file" id="fotoIrisKanan" accept="image/*" style="margin-top:5px;">
                <img id="previewIrisKanan" class="image-preview">
            </div>
        </div>

        <button type="submit" id="btnSubmit" style="margin-top:25px;">Analisis AI & Simpan Rekam Medis</button>
    </form>
</div>

<script>
    // Database Gejala dengan pemisahan Cegukan dan Sendawa
    const dataGejala = {
        "Gangguan Pencernaan (Maag, Diare, Cegukan)": [
            "Mual / Asam Lambung Naik", 
            "Perut Kembung", 
            "Diare (>3x sehari)", 
            "Cegukan Terus-Menerus", 
            "Sendawa Sering", 
            "Sembelit"
        ],
        "Gangguan Pernapasan (Batuk, Asma, Sesak)": ["Batuk Kering", "Batuk Berdahak", "Sesak Napas / Mengi", "Sakit Tenggorokan"],
        "Nyeri Otot, Sendi & Saraf (Pinggang, Jari, Tumit, dll)": ["Nyeri/Kaku Jari Tangan", "Nyeri Tumit / Engkel", "Nyeri Pinggang", "Kaku Leher/Pundak"],
        "Metabolik & Diet (Gula, Asam Urat, Obesitas)": ["Ingin Program Diet / Turunkan Berat Badan", "Tengkuk Terasa Berat", "Sering Haus & Lapar", "Nyeri Sendi Kemerahan"]
    };

    const panduanWawancara = {
        "Gangguan Pencernaan (Maag, Diare, Cegukan)": "1. Nyeri/kembung membaik jika ditekan atau dihangatkan? :\n2. Bentuk feses (kering/lembek/cair)? :\n3. Frekuensi cegukan atau sendawa? :\n4. Apakah ada stres/banyak pikiran? : "
    };

    document.getElementById('keluhanUtama').addEventListener('change', function() {
        const keluhan = this.value;
        const gejalaSelect = document.getElementById('gejalaKlien');
        gejalaSelect.innerHTML = '<option value="" disabled selected>-- Pilih Gejala --</option>';
        if (dataGejala[keluhan]) {
            dataGejala[keluhan].forEach(g => {
                const opt = document.createElement('option');
                opt.value = g; opt.textContent = g;
                gejalaSelect.appendChild(opt);
            });
        }
        if (panduanWawancara[keluhan]) {
            document.getElementById('dataWawancara').value = panduanWawancara[keluhan];
        }
    });

    let base64Lidah = "", base64IrisKiri = "", base64IrisKanan = "";

    function convertToBase64(inputElement, previewElement, callback) {
        if(inputElement.files[0]) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                previewElement.src = evt.target.result;
                previewElement.style.display = 'block';
                callback(evt.target.result);
            }
            reader.readAsDataURL(inputElement.files[0]);
        }
    }

    document.getElementById('fotoLidah').addEventListener('change', function() {
        convertToBase64(this, document.getElementById('previewLidah'), (res) => base64Lidah = res);
    });
    document.getElementById('fotoIrisKiri').addEventListener('change', function() {
        convertToBase64(this, document.getElementById('previewIrisKiri'), (res) => base64IrisKiri = res);
    });
    document.getElementById('fotoIrisKanan').addEventListener('change', function() {
        convertToBase64(this, document.getElementById('previewIrisKanan'), (res) => base64IrisKanan = res);
    });
</script>
</body>
</html>
