<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Klinik TCM - AI Iridologi & Lidah</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background-color: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; }
        .form-row { display: flex; gap: 15px; margin-bottom:15px; }
        .form-col { flex: 1; }
        label { font-weight: 600; font-size: 13px; margin-bottom: 5px; display: block; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: 'Poppins'; font-size: 14px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:disabled { background: #95a5a6; }
        .btn-wa { background: #25D366; margin-top: 15px; }
        .image-preview { width: 100%; max-height: 180px; object-fit: contain; margin-top: 10px; display: none; border-radius: 8px; border: 2px dashed #bdc3c7; padding: 5px; }
        .section-title { margin-top: 25px; margin-bottom: 15px; padding-bottom: 5px; border-bottom: 2px solid #3498db; color: #2980b9; font-size: 16px; font-weight:bold; }
        /* Modal Webcam */
        #webcamModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; flex-direction:column; align-items:center; justify-content:center; }
        #webcamVideo { width:90%; max-width:500px; border-radius:8px; border: 3px solid #fff; }
    </style>
</head>
<body>

<div id="webcamModal">
    <h3 id="webcamTitle" style="color:#fff; margin-bottom:15px;">Kamera Perangkat</h3>
    <video id="webcamVideo" autoplay playsinline></video>
    <div style="display:flex; gap:15px; margin-top:20px;">
        <button type="button" id="btnCapture" style="background:#27ae60; width:150px;">📸 Ambil Foto</button>
        <button type="button" id="btnCloseWebcam" style="background:#e74c3c; width:150px;">❌ Batal</button>
    </div>
    <canvas id="webcamCanvas" style="display:none;"></canvas>
</div>

<div class="container" id="mainApp">
    <h2>Klinik TCM & Iridologi</h2>

    <form id="formKlinis">
        <div class="section-title">👤 Profil Klien</div>
        <div class="form-row">
            <div class="form-col"><label>NRM:</label><input type="text" id="nrmKlien" placeholder="Kosongkan jika baru" readonly style="background-color: #f1f3f5;"></div>
            <div class="form-col"><label>Tensi & Nadi:</label><input type="text" id="tensiKlien" placeholder="Contoh: 120/80/80"></div>
        </div>
        <div class="form-row">
            <div class="form-col"><label>Nama Lengkap:</label><input type="text" id="namaKlien" required></div>
            <div class="form-col"><label>No. WhatsApp:</label><input type="text" id="noWaKlien"></div>
        </div>
        <div class="form-row">
            <div class="form-col"><label>Umur (Thn):</label><input type="number" id="umurKlien" required></div>
            <div class="form-col"><label>Gender:</label><select id="genderKlien" required><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></div>
            <div class="form-col"><label>BB (Kg):</label><input type="number" id="beratKlien" required></div>
        </div>
        
        <div class="section-title">🩺 Observasi Sindrom</div>
        <label>Keluhan Utama:</label>
        <select id="keluhanUtama" required style="margin-bottom:10px;">
            <option value="" disabled selected>-- Pilih Keluhan Utama --</option>
            <option value="Gangguan Pencernaan (Maag, Diare, Cegukan)">Gangguan Pencernaan (Maag, Diare, Cegukan/Sendawa)</option>
            <option value="Gangguan Pernapasan (Batuk, Asma, Sesak)">Gangguan Pernapasan (Batuk, Asma, Sesak)</option>
            <option value="Nyeri Otot, Sendi & Saraf (Pinggang, Jari, Tumit, dll)">Nyeri Otot, Sendi & Saraf (Pinggang, Jari, Tumit, dll)</option>
            <option value="Benjolan & Kelenjar (Tiroid, Lipoma, Kista Payudara)">Benjolan & Kelenjar (Tiroid, Lipoma, Kista Payudara)</option>
            <option value="THT, Kulit & Alergi (Sinus, Tinnitus, Biduran)">THT, Kulit & Alergi (Sinus, Tinnitus, Biduran)</option>
            <option value="Gangguan Penglihatan & Mata (Mata Plus/Minus, Katarak)">Gangguan Penglihatan & Mata (Mata Plus/Minus, Katarak)</option>
            <option value="Gangguan Reproduksi & Kewanitaan (Haid, Promil)">Gangguan Reproduksi & Kewanitaan (Haid, Promil)</option>
            <option value="Metabolik & Diet (Gula, Asam Urat, Obesitas)">Metabolik & Diet (Gula, Asam Urat, Obesitas)</option>
            <option value="Gangguan Tidur & Emosi (Insomnia, Stres)">Gangguan Tidur & Emosi (Insomnia, Stres)</option>
            <option value="Gangguan Neurologis (Sakit Kepala, Vertigo)">Gangguan Neurologis (Sakit Kepala, Vertigo)</option>
            <option value="Sindrom Kelelahan & Penurunan Imun">Sindrom Kelelahan & Penurunan Imun</option>
            <option value="Lainnya">Lainnya... (Ketik Manual)</option>
        </select>
        
        <input type="text" id="keluhanManual" placeholder="Ketik keluhan utama pasien..." style="display:none; margin-bottom:15px;">

        <label>Rincian Gejala Penyerta:</label>
        <textarea id="gejalaKlien" rows="2" placeholder="Pilih keluhan utama untuk melihat contoh gejala..." required style="margin-bottom:15px;"></textarea>

        <label>Catatan Wawancara (Fokus Emosi / Shen):</label>
        <textarea id="dataWawancara" rows="4" required>1. Beban Pikiran/Stres : 
2. Emosi Tertahan : 
3. Kualitas Tidur : </textarea>
        
        <div class="section-title">📸 Modul AI Vision (Lidah & Iris Ganda)</div>
        
        <!-- Foto Lidah -->
        <div style="background:#f9f9f9; padding:15px; border-radius:8px; margin-bottom:15px;">
            <label>1. Foto Lidah (Wajib):</label>
            <div style="display:flex; gap:10px; align-items:center;">
                <input type="file" id="fotoLidah" accept="image/*" required style="flex:1;">
                <button type="button" onclick="bukaWebcam('lidah')" style="width:auto; padding:10px 15px; background:#8e44ad;">📷 Kamera</button>
            </div>
            <img id="previewLidah" class="image-preview">
        </div>

        <!-- Foto Iris Kiri & Kanan -->
        <div class="form-row">
            <div class="form-col" style="background:#e8f4f8; padding:15px; border-radius:8px;">
                <label>2. Iris KIRI (Opsional):</label>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <input type="file" id="fotoIrisKiri" accept="image/*">
                    <button type="button" onclick="bukaWebcam('irisKiri')" style="padding:8px 12px; font-size:13px; background:#2980b9;">👁️ Kamera Kiri</button>
                </div>
                <img id="previewIrisKiri" class="image-preview">
            </div>
            <div class="form-col" style="background:#e8f4f8; padding:15px; border-radius:8px;">
                <label>3. Iris KANAN (Opsional):</label>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <input type="file" id="fotoIrisKanan" accept="image/*">
                    <button type="button" onclick="bukaWebcam('irisKanan')" style="padding:8px 12px; font-size:13px; background:#2980b9;">👁️ Kamera Kanan</button>
                </div>
                <img id="previewIrisKanan" class="image-preview">
            </div>
        </div>

        <button type="submit" id="btnSubmit" style="margin-top:25px;">Analisis AI & Simpan Rekam Medis</button>
    </form>
    
    <div id="hasilContainer" style="display:none; margin-top:30px; border-top:2px dashed #ccc; padding-top:20px;">
        <h3 style="color:#27ae60; text-align:center;">Diagnosis Berhasil Disimpan!</h3>
        <div style="background:#fff; padding:20px; border:1px solid #ddd; border-radius:8px; margin-top:15px; font-size:14px; line-height:1.6;" id="resLengkap"></div>
    </div>
</div>

<script>
    // MASUKKAN URL APP SCRIPT ANDA DI SINI
    const scriptURL = "https://script.google.com/macros/s/AKfycbw0egBKH6XRWd-O8CuqU3ztMSDBLgfcAN__CxH-rVFVx34CZLcfSQGRYB-4saDZyw/exec"; 

    // --- Saran Placeholder Dinamis untuk Gejala ---
    const saranGejala = {
        "Gangguan Pencernaan (Maag, Diare, Cegukan)": "Contoh: Mual, asam lambung naik, perut kembung, diare >3x, atau sering cegukan/sendawa...",
        "Gangguan Pernapasan (Batuk, Asma, Sesak)": "Contoh: Batuk kering/berdahak, sesak napas, sakit tenggorokan...",
        "Nyeri Otot, Sendi & Saraf (Pinggang, Jari, Tumit, dll)": "Contoh: Nyeri pinggang, kaku leher, jari kaku, lutut sakit...",
        "Benjolan & Kelenjar (Tiroid, Lipoma, Kista Payudara)": "Contoh: Benjolan di leher (tiroid), payudara, atau sendi...",
        "THT, Kulit & Alergi (Sinus, Tinnitus, Biduran)": "Contoh: Biduran, gatal-gatal, hidung mampet, telinga berdenging...",
        "Gangguan Penglihatan & Mata (Mata Plus/Minus, Katarak)": "Contoh: Pandangan kabur, mata merah, katarak, glaukoma...",
        "Gangguan Reproduksi & Kewanitaan (Haid, Promil)": "Contoh: Nyeri haid hebat, siklus tidak teratur, keputihan...",
        "Metabolik & Diet (Gula, Asam Urat, Obesitas)": "Contoh: Berat badan berlebih, tengkuk berat, sering haus/lapar...",
        "Gangguan Tidur & Emosi (Insomnia, Stres)": "Contoh: Sulit tidur, sering terbangun, dada berdebar, cemas...",
        "Gangguan Neurologis (Sakit Kepala, Vertigo)": "Contoh: Vertigo berputar, migrain, tangan gemetar (tremor)...",
        "Sindrom Kelelahan & Penurunan Imun": "Contoh: Badan sangat berat, mudah lelah, keringat dingin..."
    };

    document.getElementById('keluhanUtama').addEventListener('change', function() {
        const keluhan = this.value;
        const inputManual = document.getElementById('keluhanManual');
        const gejalaBox = document.getElementById('gejalaKlien');

        if(keluhan === "Lainnya") {
            inputManual.style.display = "block";
            inputManual.required = true;
            gejalaBox.placeholder = "Ketik rincian gejala...";
        } else {
            inputManual.style.display = "none";
            inputManual.required = false;
            inputManual.value = "";
            gejalaBox.placeholder = saranGejala[keluhan] || "Ketik rincian gejala...";
        }
    });

    let base64Lidah = "", base64IrisKiri = "", base64IrisKanan = "";
    let videoStream = null;
    let currentCamTarget = "";

    async function bukaWebcam(target) {
        currentCamTarget = target;
        let title = target === 'lidah' ? "📸 Foto Lidah" : target === 'irisKiri' ? "👁️ Iris Kiri" : "👁️ Iris Kanan";
        document.getElementById('webcamTitle').innerText = title;
        document.getElementById('webcamModal').style.display = 'flex';
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            document.getElementById('webcamVideo').srcObject = videoStream;
        } catch (err) {
            alert("Gagal mengakses kamera.");
            document.getElementById('webcamModal').style.display = 'none';
        }
    }

    document.getElementById('btnCloseWebcam').addEventListener('click', function() {
        if (videoStream) { videoStream.getTracks().forEach(track => track.stop()); }
        document.getElementById('webcamModal').style.display = 'none';
    });

    document.getElementById('btnCapture').addEventListener('click', function() {
        const video = document.getElementById('webcamVideo');
        const canvas = document.getElementById('webcamCanvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        
        let b64 = canvas.toDataURL('image/jpeg');
        if(currentCamTarget === 'lidah') {
            base64Lidah = b64;
            document.getElementById('previewLidah').src = b64; document.getElementById('previewLidah').style.display = 'block';
            document.getElementById('fotoLidah').required = false;
        } else if (currentCamTarget === 'irisKiri') {
            base64IrisKiri = b64;
            document.getElementById('previewIrisKiri').src = b64; document.getElementById('previewIrisKiri').style.display = 'block';
        } else {
            base64IrisKanan = b64;
            document.getElementById('previewIrisKanan').src = b64; document.getElementById('previewIrisKanan').style.display = 'block';
        }
        if (videoStream) { videoStream.getTracks().forEach(track => track.stop()); }
        document.getElementById('webcamModal').style.display = 'none';
    });

    function handleFile(inputElement, previewElement, callback) {
        inputElement.addEventListener('change', function(e) {
            if(e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    previewElement.src = evt.target.result;
                    previewElement.style.display = 'block';
                    callback(evt.target.result);
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        });
    }

    handleFile(document.getElementById('fotoLidah'), document.getElementById('previewLidah'), res => base64Lidah = res);
    handleFile(document.getElementById('fotoIrisKiri'), document.getElementById('previewIrisKiri'), res => base64IrisKiri = res);
    handleFile(document.getElementById('fotoIrisKanan'), document.getElementById('previewIrisKanan'), res => base64IrisKanan = res);

    document.getElementById('formKlinis').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true; btn.innerText = "🧠 Memproses AI...";
        
        const valKeluhan = document.getElementById('keluhanUtama').value;
        const finalKeluhan = valKeluhan === "Lainnya" ? document.getElementById('keluhanManual').value : valKeluhan;

        const payload = {
            action: "insert", 
            nrm: document.getElementById('nrmKlien').value, 
            namaKlien: document.getElementById('namaKlien').value,
            noWa: document.getElementById('noWaKlien').value,
            umur: document.getElementById('umurKlien').value,
            gender: document.getElementById('genderKlien').value,
            berat: document.getElementById('beratKlien').value,
            tensi: document.getElementById('tensiKlien').value,
            keluhan: finalKeluhan,
            gejala: document.getElementById('gejalaKlien').value, 
            wawancara: document.getElementById('dataWawancara').value,
            imgLidah: base64Lidah,
            imgIrisKiri: base64IrisKiri,
            imgIrisKanan: base64IrisKanan
        };

        try {
            const res = await fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await res.json();
            if (result.status === "sukses") {
                const rd = result.data;
                document.getElementById('resLengkap').innerHTML = `
                    <b style="color:#8e44ad; font-size:15px;">👁️ Iridologi Kiri:</b> ${rd.iris_kiri || "-"}<br>
                    <b style="color:#8e44ad; font-size:15px;">👁️ Iridologi Kanan:</b> ${rd.iris_kanan || "-"}<hr style="border: 0.5px solid #eee;">
                    <b style="color:#e74c3c; font-size:16px;">${rd.diagnosis}</b><br>
                    <i style="color:#555;">${rd.penjelasan}</i><hr style="border: 0.5px solid #eee; margin:15px 0;">
                    <b>🎯 Tung:</b> ${rd.tung}<br><br>
                    <b>⚖️ Tan:</b> ${rd.tan}<br><br>
                    <b>🤲 Tuina:</b> ${rd.tuina}<br><br>
                    <b>🌿 Jamu:</b> ${rd.jamu}<hr style="border: 0.5px solid #eee; margin:15px 0;">
                    <b>🥗 Makanan:</b> ${rd.makanan}
                `;
                document.getElementById('hasilContainer').style.display = "block"; 
            } else { alert("Gagal: " + result.pesan); }
        } catch (e) { alert("Server Sibuk."); } 
        finally { btn.disabled = false; btn.innerText = "Analisis AI & Simpan"; }
    });
</script>
</body>
</html>
