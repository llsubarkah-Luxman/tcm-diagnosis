<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDSS TCM - Gemini Vision API</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #444; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .checkbox-group { background: #f9f9f9; padding: 15px; border-radius: 5px; border: 1px solid #eee; }
        .checkbox-item { display: flex; align-items: center; margin-bottom: 8px; }
        .checkbox-item input { margin-right: 10px; width: 18px; height: 18px; }
        .image-preview { width: 100%; max-height: 300px; object-fit: contain; margin-top: 10px; border-radius: 5px; display: none; background: #000; }
        button { width: 100%; padding: 15px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        /* Area Hasil Diagnosis */
        #hasilContainer { display: none; margin-top: 30px; padding: 20px; background-color: #fdfbf7; border: 1px solid #e0dcd3; border-radius: 8px; }
        .diagnosis-title { color: #e74c3c; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .penjelasan { font-style: italic; color: #555; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 15px; }
        .section-title { font-weight: bold; margin-top: 15px; display: flex; align-items: center; }
        .section-title span { margin-right: 8px; }
        .footer-note { text-align: center; font-size: 12px; color: #27ae60; margin-top: 25px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Asisten CDSS TCM & Master Tung</h2>

    <form id="formKlinis">
        <div class="form-group">
            <label>1. Nama Lengkap Klien:</label>
            <input type="text" id="namaKlien" placeholder="Contoh: Budi Santoso" required>
        </div>

        <div class="form-group">
            <label>2. Pilih Keluhan Utama Klien:</label>
            <select id="keluhanUtama" required>
                <option value="" disabled selected>-- Pilih Keluhan --</option>
                <option value="Gangguan Pencernaan (Maag, Diare, Sembelit)">Gangguan Pencernaan (Maag, Diare, Sembelit)</option>
                <option value="Gangguan Pernapasan (Batuk, Asma, Sesak)">Gangguan Pernapasan (Batuk, Asma, Sesak)</option>
                <option value="Nyeri Otot & Sendi (Sakit Pinggang, Rematik)">Nyeri Otot & Sendi (Sakit Pinggang, Rematik)</option>
                <option value="Gangguan Tidur & Emosi (Insomnia, Stres)">Gangguan Tidur & Emosi (Insomnia, Stres)</option>
                <option value="Gangguan Neurologis (Sakit Kepala, Vertigo, Stroke)">Gangguan Neurologis (Sakit Kepala, Vertigo, Stroke)</option>
            </select>
        </div>

        <div class="form-group">
            <label>3. Centang Gejala Penyerta:</label>
            <div id="gejalaContainer" class="checkbox-group">
                <p style="color:#7f8c8d; font-size: 14px; margin:0;">Silakan pilih keluhan utama terlebih dahulu.</p>
            </div>
        </div>

        <div class="form-group">
            <label>4. Unggah Foto Lidah:</label>
            <p style="font-size: 12px; color: #777; margin-top: -5px;">Bebas jarak jauh/dekat, AI akan menyesuaikan otomatis.</p>
            <input type="file" id="fotoLidah" accept="image/*" required>
            <img id="previewGambar" class="image-preview" alt="Preview Lidah">
        </div>

        <button type="submit" id="btnSubmit">Kirim & Analisis via AI</button>
    </form>

    <!-- Area untuk menampilkan hasil dari AI -->
    <div id="hasilContainer">
        <div class="diagnosis-title" id="resDiagnosis"></div>
        <div class="penjelasan" id="resPenjelasan"></div>
        
        <div class="section-title"><span>🎯</span> Titik Akupunktur Master Tung:</div>
        <div id="resTitik"></div>
        
        <div class="section-title"><span>💊</span> Formula Kapsul Jamu (500mg):</div>
        <div id="resJamu"></div>
        
        <div class="section-title"><span>🏃</span> Terapi Fisik:</div>
        <div id="resFisik"></div>
        
        <div class="section-title"><span>🥗</span> Edukasi Pola Makan:</div>
        <div id="resMakanan"></div>

        <div class="footer-note">💾 Data otomatis tersimpan ke Rekam Medis (Google Sheets).</div>
    </div>
</div>

<script>
    // --- DATABASE GEJALA DINAMIS ---
    const dataGejala = {
        "Gangguan Pencernaan (Maag, Diare, Sembelit)": [
            "Mual / Muntah / Asam Lambung Naik (GERD)",
            "Perut Kembung / Begah / Banyak Gas",
            "Diare / BAB Cair (Lebih dari 3x sehari)",
            "Sembelit / BAB Keras atau Sulit"
        ],
        "Gangguan Pernapasan (Batuk, Asma, Sesak)": [
            "Batuk Kering / Tidak Berdahak",
            "Batuk Berdahak (Putih/Kuning/Hijau)",
            "Sesak Napas / Mengi (Asma)",
            "Sakit Tenggorokan / Kering"
        ],
        "Nyeri Otot & Sendi (Sakit Pinggang, Rematik)": [
            "Nyeri Pinggang Belakang",
            "Nyeri Lutut / Persendian Bengkak",
            "Kaku Leher dan Pundak",
            "Mati Rasa / Kesemutan di Ekstremitas"
        ],
        "Gangguan Tidur & Emosi (Insomnia, Stres)": [
            "Sulit Memulai Tidur",
            "Sering Terbangun di Tengah Malam",
            "Gelisah / Mudah Marah / Stres",
            "Dada Berdebar (Palpitasi)"
        ],
        "Gangguan Neurologis (Sakit Kepala, Vertigo, Stroke)": [
            "Sakit Kepala Pusing (Berputar/Vertigo)",
            "Sakit Kepala Sebelah (Migrain)",
            "Kelemahan Anggota Gerak (Pasca Stroke)",
            "Tremor / Gemetar"
        ]
    };

    // --- LOGIK GEJALA DINAMIS ---
    const keluhanSelect = document.getElementById('keluhanUtama');
    const gejalaContainer = document.getElementById('gejalaContainer');

    keluhanSelect.addEventListener('change', function() {
        const keluhanTerpilih = this.value;
        const gejalaList = dataGejala[keluhanTerpilih];
        
        gejalaContainer.innerHTML = ''; // Kosongkan kontainer
        
        gejalaList.forEach(gejala => {
            const div = document.createElement('div');
            div.className = 'checkbox-item';
            div.innerHTML = `
                <input type="checkbox" name="gejala" value="${gejala}">
                <label style="margin:0; font-weight:normal; font-size:14px;">${gejala}</label>
            `;
            gejalaContainer.appendChild(div);
        });
    });

    // --- LOGIK PREVIEW & KONVERSI GAMBAR (Base64) ---
    const fotoInput = document.getElementById('fotoLidah');
    const previewGambar = document.getElementById('previewGambar');
    let imageBase64Data = "";

    fotoInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                previewGambar.src = event.target.result;
                previewGambar.style.display = 'block';
                imageBase64Data = event.target.result; // Simpan base64
            }
            reader.readAsDataURL(file);
        }
    });

    // --- LOGIK PENGIRIMAN KE GOOGLE SCRIPT ---
    const formKlinis = document.getElementById('formKlinis');
    const btnSubmit = document.getElementById('btnSubmit');
    const hasilContainer = document.getElementById('hasilContainer');

    // ⚠️⚠️⚠️ GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE SCRIPT TERBARU AKANG ⚠️⚠️⚠️
    const scriptURL = "https://script.google.com/macros/s/AKfycbw0egBKH6XRWd-O8CuqU3ztMSDBLgfcAN__CxH-rVFVx34CZLcfSQGRYB-4saDZyw/exec"; 

    formKlinis.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        if (!imageBase64Data) {
            alert("Harap unggah foto lidah terlebih dahulu!");
            return;
        }

        // Kumpulkan data gejala yang dicentang
        const gejalaChecked = Array.from(document.querySelectorAll('input[name="gejala"]:checked'))
                                   .map(cb => cb.value)
                                   .join(', ');

        const payload = {
            namaKlien: document.getElementById('namaKlien').value,
            keluhan: document.getElementById('keluhanUtama').value,
            gejala: gejalaChecked || "Tidak ada gejala penyerta spesifik",
            imageBase64: imageBase64Data
        };

        // Ubah tampilan tombol jadi loading
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = "⏳ Sedang membedah gambar & meracik resep...";
        hasilContainer.style.display = "none";

        try {
            const response = await fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            
            const result = await response.json();
            
            if (result.status === "sukses") {
                // Tampilkan data AI ke HTML
                document.getElementById('resDiagnosis').innerText = result.data.diagnosis;
                document.getElementById('resPenjelasan').innerText = result.data.penjelasan;
                // Gunakan innerHTML dan replace \n dengan <br> agar baris baru dari AI rapi
                document.getElementById('resTitik').innerHTML = result.data.titik.replace(/\n/g, '<br>');
                document.getElementById('resJamu').innerHTML = result.data.jamu.replace(/\n/g, '<br>');
                document.getElementById('resFisik').innerHTML = result.data.fisik.replace(/\n/g, '<br>');
                document.getElementById('resMakanan').innerHTML = result.data.makanan.replace(/\n/g, '<br>');
                
                hasilContainer.style.display = "block"; // Tampilkan kotak hasil
            } else {
                alert("Gagal memproses: " + result.pesan);
            }
        } catch (error) {
            alert("Terjadi kesalahan jaringan/sistem: " + error);
        } finally {
            // Kembalikan tombol seperti semula
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = "Kirim & Analisis via AI";
        }
    });
</script>

</body>
</html>
